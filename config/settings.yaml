# ==========================================================
# AR-Clipper — الإعدادات العامة (Single source of runtime config)
# كل قيمة هنا يمكن تجاوزها عبر متغير بيئة بالصيغة: ARCLIPPER__<SECTION>__<KEY>
# مثال:  ARCLIPPER__TRANSCRIBE__MODEL=small
# ==========================================================

paths:
  data_dir: data
  raw_videos: data/raw_videos
  transcripts: data/transcripts
  clips: data/clips
  registry: data/registry
  templates: config/templates
  tmp: data/tmp

ingest:
  # جودة التحميل القصوى (المرحلة 1: 720p تكفي للمعالجة)
  max_height: 720
  # صيغة الحاوية المفضّلة بعد الدمج
  container: mp4
  # ---- أساس الاستخدام (المبدأ 4 في الوثيقة) ----
  # الوضع:
  #   required = لا بد من تمرير --license في كل مرة (الأصرم)
  #   default  = إن لم تمرّر شيئاً تُستخدم default_license أدناه (الموصى به)
  #   off      = بلا اشتراط إطلاقاً
  # في كل الأحوال تُسجَّل القيمة النهائية في metadata.json لكل مقطع.
  license_mode: default
  # القيم الجاهزة: campaign | owner_permission | own_content | cc_by |
  #                fair_use_edu | personal_test
  default_license: personal_test

transcribe:
  # المحرك: faster_whisper (افتراضي محلي) | whisperx (اختياري إن كان مثبتاً)
  engine: faster_whisper
  # tiny | base | small | medium | large-v3  → الأصغر أسرع على CPU
  model: small
  device: auto          # auto | cpu | cuda
  compute_type: auto    # auto | int8 | int8_float16 | float16 | float32
  language: null        # null = كشف تلقائي للغة
  beam_size: 5
  vad_filter: true
  word_timestamps: true

translate:
  # nllb (افتراضي محلي) | argos | passthrough (بدون ترجمة، للاختبار)
  engine: nllb
  target_lang: ar
  nllb_model: facebook/nllb-200-distilled-600M
  batch_size: 8
  max_chars_per_request: 400

silence:
  enabled: true
  # ffmpeg (افتراضي، بدون تبعيات إضافية) | auto_editor (إن كان مثبتاً)
  engine: ffmpeg
  threshold_db: -34.0     # ما دون هذه الشدة يُعتبر صمتاً
  min_silence_ms: 700     # أقصر فترة صمت تُحذف
  keep_padding_ms: 120    # هامش أمان يُترك حول الكلام حتى لا تُقطع الحروف

reframe:
  enabled: true
  aspect: "9:16"
  # center (المرحلة 1) | face_track (المرحلة 3)
  mode: center
  width: 1080
  height: 1920
  # 0.0 = يسار/أعلى، 0.5 = المنتصف، 1.0 = يمين/أسفل
  focus_x: 0.5
  focus_y: 0.5

  # --- تتبّع الوجه (المرحلة 3) — يعمل فقط عندما mode: face_track ---
  # opencv = Haar المرفق مع الحزمة، بلا تنزيل ولا شبكة (موصى به)
  face_engine: opencv
  # عدد العيّنات في الثانية: الوجه لا يقفز 25 مرة/ث، والمسح الكامل هدر
  sample_fps: 3.0
  # أصغر وجه معتبر، نسبةً لعرض الإطار (يمنع الكشف الخاطئ على التفاصيل)
  min_face_ratio: 0.05
  # إن كُشف وجه في أقل من هذه النسبة من العيّنات → تراجع للقص المركزي
  min_detection_rate: 0.25
  # نافذة المتوسط المتحرك لإزالة الرجفة
  smooth_window: 5
  # أقصى إزاحة أفقية مسموحة بين عيّنتين (يمنع قفز الكاميرا)
  max_step: 0.04
  # إن كان انتشار المسار أقل من هذا → قص ثابت على مركز الثقل بدل تعبير متحرك
  static_threshold: 0.04
  # حوار بين متحدثَين → شاشة منقسمة رأسياً بدل قطع أحدهما
  split_screen: true
  # النسبة الدنيا من العيّنات التي تُظهر وجهَين لاعتبارها حواراً
  dialogue_min_ratio: 0.4
  # المسافة الأفقية الدنيا بين الوجهين (نسبةً لعرض الإطار)
  dialogue_min_gap: 0.25
  # تخزين مسار الوجه مؤقتاً — يُسقط كلفة التتبّع عند إعادة الإنتاج
  cache_tracks: true

subtitles:
  enabled: true
  burn: true
  # النص الذي يُحرق على الفيديو: ar | source | bilingual
  track: ar
  font_name: DejaVu Sans
  font_size: 54
  primary_color: "#FFFFFF"
  # لون الكلمات قبل نطقها في وضع الكاريوكي (رمادي هادئ، لا أحمر صارخ)
  secondary_color: "#9AA0A6"
  outline_color: "#000000"
  back_color: "#A0000000"
  outline: 3
  shadow: 1
  bold: true
  margin_v: 180
  # عدد الأحرف الأقصى للسطر الواحد قبل اللف
  max_line_chars: 38
  max_lines: 2
  rtl: true

  # --- ترجمة متحركة (المرحلة 3) ---
  # تلوّن الكلمة أثناء نطقها (كاريوكي) وتُبرز الكلمات المهمة
  animated: false
  highlight_keywords: true
  highlight_color: "#FFD700"
  # نسبة الكلمات التي تُبرَز من مجموع الكلمات المؤهلة
  keyword_ratio: 0.25
  keyword_min_len: 4
  # مدة الظهور/الاختفاء الناعم للسطر (ميلي ثانية)
  fade_ms: 120
  # تكبير خفيف عند ظهور السطر
  pop_in: true

# ============================================================
# المرحلة 3: الهوية البصرية والتصميم
# ============================================================

branding:
  # الهوية معطّلة افتراضياً — تُفعَّل حين يجهّز المستخدم شعاره
  enabled: false
  # مسار صورة PNG شفافة (نسبي للمشروع أو مطلق)
  logo_path: ""
  # top_left | top_right | bottom_left | bottom_right | top_center | bottom_center
  logo_corner: top_right
  # حجم الشعار نسبةً لعرض الفيديو
  logo_scale: 0.14
  logo_opacity: 0.85
  margin: 40
  # اسم الحساب كعلامة مائية (اتركه فارغاً لتعطيلها)
  handle: ""
  handle_corner: bottom_center
  handle_margin: 60
  handle_scale: 0.028
  handle_opacity: 0.55

thumbnail:
  enabled: true
  width: 1080
  height: 1920
  quality: 88
  # حجم خط النص الجذاب نسبةً لعرض الصورة
  font_scale: 0.075
  max_line_chars: 22
  max_lines: 3
  # اتركه فارغاً للكشف التلقائي عن خط يدعم العربية
  font_file: ""

variants:
  # إنتاج عدة نسخ من نفس المقطع لاختبار الأداء (A/B)
  enabled: false
  max_variants: 3

export:
  video_codec: libx264
  audio_codec: aac
  crf: 20
  # veryfast بدل medium: قياس فعلي على مقطع 20s أعطى 8.2s مقابل 14.1s
  # بنفس الحجم تماماً (6.0MB) وفرق بصري غير مُدرك (SSIM = 0.998).
  # للجودة القصوى استخدم --preset quality (يرفعها إلى slow).
  preset: veryfast
  audio_bitrate: 160k
  fps: 30
  # صيغ ملفات الترجمة التي تُحفظ بجانب الفيديو
  sidecar_formats: [srt, vtt, ass]

# ==========================================================
# اللمسات النهائية — تمريرة واحدة قبل التصدير
# بلا أي تبعية: الفلترات مدمجة في ffmpeg المرفق
# ==========================================================

polish:
  enabled: true
  # تطبيع الجهارة لمعيار EBU R128 — يوحّد مستوى الصوت بين كل مقاطعك
  # ويمنع المنصات من تعديله عند النشر
  normalize_audio: true
  loudness_target: -16.0    # LUFS — الموصى به لمقاطع الموبايل القصيرة
  true_peak: -1.5           # dBTP — هامش أمان ضد الـclipping
  loudness_range: 11.0
  # ظهور واختفاء ناعم بالثواني (0 = تعطيل)
  fade_duration: 0.4

runtime:
  # مسار ffmpeg/ffprobe — اتركه null للكشف التلقائي (PATH ثم imageio-ffmpeg)
  ffmpeg_path: null
  ffprobe_path: null
  # حذف الملفات الوسيطة بعد نجاح المعالجة (القسم 14 من الوثيقة)
  cleanup_temp: true
  log_level: INFO

# ==========================================================
# المرحلة 2 — الذكاء في الاختيار والمحتوى
# ==========================================================

analyze:
  # heuristic = بلا نموذج إطلاقاً | llm = النموذج مباشرةً | hybrid = الاثنان (الأدق)
  engine: hybrid
  # محرك النموذج: ollama (محلي مجاني) | none | api (اختياري بمفتاحك)
  llm_engine: ollama
  ollama_host: "http://127.0.0.1:11434"
  # 16GB RAM → qwen2.5:7b (4.7GB). لجهاز أضعف: qwen2.5:3b (1.9GB)
  model: "qwen2.5:7b"
  num_ctx: 8192
  timeout: 300
  # عدد المقاطع المقترحة ومداها الزمني
  max_moments: 8
  min_duration: 20.0
  max_duration: 70.0
  # تقسيم الأفكار الطويلة إلى Part 1 / Part 2
  split_long: true

content_gen:
  enabled: true
  # توليد العناوين والهاشتاغات عبر النموذج (يسقط للاستدلال عند غيابه)
  use_llm: true

diarize:
  # فصل المتحدثين — يحتاج توكن HuggingFace مجاني (راجع core/diarize/speakers.py)
  enabled: true
  model: "pyannote/speaker-diarization-3.1"
  hf_token: null        # أو صدّر HF_TOKEN في البيئة
  # للبودكاست الحواري (مضيف + ضيف) هذه القيم تسرّع وتدقّق النتيجة
  min_speakers: null
  max_speakers: null

safety:
  enabled: true
  # مراجعة إضافية للترجمة عبر النموذج (أبطأ)
  use_llm: false
