# ==========================================================
# قوائم الكلمات الحساسة — قابلة للتوسعة بحرية
#
# الغرض ليس الرقابة، بل تنبيهك قبل النشر إلى ما قد:
#   - يُسقط المقطع من حملة clipping
#   - يُقيّد الوصول على المنصات
#   - يُسيء للمعنى الأصلي
#
# الفئات وشدّتها:
#   profanity        → تحذير
#   platform_risk    → تحذير (كلمات تُقيّد الوصول على TikTok/YouTube)
#   sensitive_topics → معلومة فقط
#   claims           → معلومة فقط (ادعاءات تحتاج تدقيقاً)
#
# أضف كلماتك بحرية — الملف يُقرأ في كل تشغيل.
# ==========================================================

profanity:
  # تُترك شبه فارغة عمداً — أضف ما يناسب جمهورك ولهجتك
  - fuck
  - shit
  - bitch
  - asshole

platform_risk:
  # كلمات معروف أنها تُقلّل الوصول أو تُفعّل المراجعة الآلية
  - kill
  - suicide
  - die
  - drugs
  - cocaine
  - gun
  - انتحار
  - مخدرات
  - سلاح
  - قتل

sensitive_topics:
  # مواضيع تستحق مراجعة السياق قبل النشر
  - politics
  - religion
  - israel
  - palestine
  - war
  - سياسة
  - دين
  - حرب
  - طائفة

claims:
  # ادعاءات مطلقة تحتاج تدقيقاً قبل نسبها لضيفك
  - guaranteed
  - 100% sure
  - never fails
  - cure
  - مضمون 100
  - علاج نهائي
  - لا يفشل أبداً
